name: Demo GIF

# Renders docs/demo.gif from demo.tape using VHS on a GitHub runner and commits
# it back. Fully automated: runs whenever the tape/example changes, or on demand
# via the "Run workflow" button. No local tooling required.
#
# VHS + its deps (ttyd, ffmpeg) are installed directly via apt/release binaries
# rather than charmbracelet/vhs-action, whose bundled ffmpeg install is flaky.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'demo.tape'
      - 'examples/basic/server.mjs'
      - '.github/workflows/demo.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install VHS, ttyd and ffmpeg
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          # ttyd (static binary)
          sudo curl -fsSL https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64 \
            -o /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd
          # vhs (charm apt repo)
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \
            | sudo tee /etc/apt/sources.list.d/charm.list
          sudo apt-get update
          sudo apt-get install -y vhs
          vhs --version && ttyd --version && ffmpeg -version | head -1

      # Install the published CLI so the tape can call `pentry`.
      - run: npm install -g @red_official/pentry
      - run: pentry --version

      # Start the intentionally-vulnerable demo app on :4000.
      - name: Start demo app
        run: |
          node examples/basic/server.mjs &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000 >/dev/null && break
            sleep 1
          done

      - name: Render GIF
        run: vhs demo.tape

      - name: Commit the GIF if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          if git diff --staged --quiet; then
            echo "No GIF changes."
          else
            git commit -m "chore: regenerate demo GIF [skip ci]"
            git push
          fi
