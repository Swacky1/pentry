name: Release

# Publishes to npm with provenance when a version tag (vX.Y.Z) is pushed.
# Security model:
#   - Runs only on tag pushes from this repo (not on PRs / forks).
#   - Uses a GitHub Environment ("release") so the publish can require manual
#     approval before the NPM_TOKEN is ever exposed to a job.
#   - Least-privilege permissions; id-token:write only for npm provenance.
#   - Verifies the tag matches package.json before publishing.

on:
  push:
    tags:
      # Only full semver tags publish. Floating tags like `v1` (used for the
      # GitHub Action) never trigger a publish.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Create this environment in repo Settings → Environments and add required
    # reviewers to gate every publish behind a human approval.
    environment:
      name: release
      url: https://www.npmjs.com/package/@red_official/pentry
    permissions:
      contents: read
      id-token: write # required for npm provenance (Sigstore)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # Guard: the git tag must match the version in package.json.
      - name: Verify tag matches package.json
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json ($PKG_VERSION)"; exit 1
          fi

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Skip publishing if this exact version is already on npm — makes re-runs
      # (e.g. after moving a tag) idempotent instead of failing.
      - name: Check if already published
        id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VER is already on npm — skipping publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Publishes with provenance. Requires an NPM_TOKEN (Automation token)
      # stored as a secret on the "release" environment or the repository.
      - if: steps.published.outputs.skip == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
